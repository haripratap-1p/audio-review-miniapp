[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "review-app"
version = "0.1.0"
description = "Review API and Telegram poster for the audio review Mini App"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["review_app"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
